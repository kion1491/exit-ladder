# GitHub Pages 자동 배포
# main에 푸시하면 정적 빌드(out/)를 만들어 Pages로 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 남긴다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test          # 계산 검증 벡터가 깨지면 배포하지 않는다
      - run: npm run build
      - run: touch out/.nojekyll   # _next/ 디렉토리가 Jekyll에 무시되는 사고 방지
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
